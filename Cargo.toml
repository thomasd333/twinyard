[workspace]
resolver = "3"
members = ["crates/core", "crates/remote", "app/src-tauri"]

[workspace.package]
version = "0.9.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
twinyard-core = { path = "crates/core" }
twinyard-remote = { path = "crates/remote" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# unwind: a bug in one job ends that job (jobs.rs catch_unwind), not the program
panic = "unwind"

# Faster dev builds of heavy deps, our code stays debuggable
[profile.dev.package."*"]
opt-level = 2
