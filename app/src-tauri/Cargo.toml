[package]
name = "twinyard"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "twinyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
twinyard-core.workspace = true
twinyard-remote.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2.7.3"
notify = "8.2.2"
drag = "2.1.1"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Foundation"] }
log = { version = "0.4.35", features = ["std"] }
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
